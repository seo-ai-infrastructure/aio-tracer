 const edges=G.edges.filter(e=>e.claim_id===c.id),citations=edges.filter(e=>e.relation==='displayed_citation'),other=edges.filter(e=>e.relation!=='displayed_citation');
 const matches=R.research.passage_comparisons.filter(x=>x.claim_id===c.id),observed=matches.filter(x=>x.source_role==='displayed_citation'),candidates=matches.filter(x=>x.source_role!=='displayed_citation');
 const controlPath=id=>G.controls.find(x=>x.id===id)?.path;
 const shown=citations.filter(e=>e.observed_url||!citations.some(x=>x.observed_url&&controlPath(x.control_id)===controlPath(e.control_id)));
 const distinct=[...new Map(shown.map(e=>[(e.observed_url||'unresolved')+'|'+e.scope,e])).values()];
 const occurrence=c.occurrences[0],state=states[occurrence?.state_id];
 el.innerHTML=`<section class="panel"><div class="step">01 / DISPLAYED CLAIM</div><div class="quote">${esc(c.text)}</div><p>${esc(c.entity.name||'Entity unresolved')} ${tag(c.surface)}</p>${c.facts.map(f=>tag(f.kind+': '+f.raw)).join('')}<details><summary>Exact text and DOM evidence</summary><p><code>${esc(occurrence?.container_path)}</code></p><p>Offsets ${occurrence?.start}–${occurrence?.end} · ${esc(occurrence?.offset_unit)}</p><pre>${esc(occurrence?.container_text)}</pre>${shot(state?.screenshot)}<p>${link(state?.snapshot_file,'State JSON')}</p></details></section>
 <section class="panel"><div class="step">02 / DISPLAYED CITATION</div>${distinct.length?distinct.map(e=>`<div><h3>${link(e.observed_url,e.destination_label||e.observed_url||'Unresolved citation control')}</h3>${tag(e.scope)}${tag(e.evidence_basis)}<p>Linked span: ${esc(e.anchor_text||'Association applies to the recorded sentence or group.')}</p>${e.action_id?`<button data-action="${e.action_id}">Inspect opening action</button>`:''}</div>`).join(''):'<p class="empty">No resolved citation association was observed for this claim.</p>'}<details><summary>Entity, website and other relationships (${other.length})</summary><pre>${esc(JSON.stringify(other,null,2))}</pre></details><div id="action-details"></div></section>
 <section class="panel"><div class="step">03 / SUPPORTING PASSAGE</div>${observed.length?observed.map(renderPassage).join(''):'<p class="empty">No passage comparison is available from a displayed citation. A missing passage is not a contradiction.</p>'}</section>
 <section class="panel"><div class="step">04 / CANDIDATES & RE-SEARCH</div><p class="muted">These pages were found by the tool or supplied for checking. They are separate from displayed Google citations.</p>${candidates.length?candidates.map(renderPassage).join(''):'<p>No candidate passage comparisons recorded.</p>'}<details><summary>Reconstructed searches</summary><pre>${esc(JSON.stringify(R.research.research_queries.filter(q=>q.claim_id===c.id),null,2))}</pre></details></section>`;
 document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=R.capture_evidence.actions.find(a=>a.id===b.dataset.action);document.getElementById('action-details').innerHTML=`<details open><summary>${esc(a.type)}: ${esc(a.control.label)}</summary><p>${tag(a.association)}${tag(a.status)}</p><div class="grid2"><div><h3>Before</h3>${shot(states[a.before_state_id]?.screenshot)}</div><div><h3>After</h3>${shot(states[a.after_state_id]?.screenshot)}</div></div><pre>${esc(JSON.stringify(a,null,2))}</pre></details>`;});}
function renderPassage(x){return `<details ${['full_text_supported','parts_supported'].includes(x.status)?'open':''}><summary>${pretty(x.status)} · ${esc(x.source_role)}</summary><p>${tag(x.status)} ${link(x.resolved_url)}</p><blockquote class="quote">${esc(x.quote)}</blockquote><p class="muted">Captured ${esc(x.captured_at)} · <code>${esc(x.evidence_location.path)}</code></p><div>${Object.entries(x.checks).map(([k,v])=>tag(k+': '+v.status)).join('')}</div><div class="scroll"><table><tr><th>Claim fact</th><th>Source fact</th><th>Result</th></tr>${x.fact_checks.map(f=>`<tr><td>${esc(f.claim_fact.raw)}</td><td>${esc(f.source_fact?.raw||'Not found')}</td><td>${tag(f.status)}<br>${esc(f.reason)}</td></tr>`).join('')}</table></div><p>${link(x.screenshot,'Source screenshot')} · Generation origin: unknown</p></details>`;}
document.getElementById('competitors').innerHTML=`<section class="panel"><div class="step">COMMERCIAL FACT COMPARISON</div><h2>Competitor evidence and client coverage</h2><p class="muted">Only the supplied client pages were checked. Verify the client actually offers a fact before adding it.</p><div class="scroll"><table><tr><th>Business / claim</th><th>Fact</th><th>Observed support</th><th>Client pages</th></tr>${R.competitor_comparison.map(r=>`<tr><td>${esc(r.competitor.name||'Unresolved')}<br><button data-jump="${r.claim_id}">Inspect chain</button></td><td>${tag(r.fact.kind)}<br>${esc(r.fact.raw)}</td><td>${tag(r.google_citation_observed?'citation_observed':'no_citation_observed')}<br>${tag(r.supported_by_displayed_citation?'cited_passage_supported':'support_unresolved')}</td><td>${esc(pretty(r.client_corpus_status))}</td></tr>`).join('')}</table></div></section>`;
const H=R.history||{};document.getElementById('history').innerHTML=`<section class="panel"><div class="step">CHAIN HISTORY</div><h2>Changes across comparable captures</h2><p class="muted">${esc(H.independence||'')}</p>${H.previous_comparable_run?`<p>Previous comparable observation: <code>${esc(H.previous_comparable_run)}</code></p>`:`<p>${esc(H.comparison_note||'This is the first observation in this context.')}</p>`}${(H.diff?.chain_changes||[]).map(d=>`<details open><summary>${d.changes.map(pretty).join(' · ')}</summary><div class="grid2"><div><h3>Before</h3><pre>${esc(JSON.stringify(d.before,null,2))}</pre></div><div><h3>After</h3><pre>${esc(JSON.stringify(d.after,null,2))}</pre></div></div></details>`).join('')}<details><summary>Retrieved page content changes</summary><pre>${esc(JSON.stringify(H.diff?.document_content_changes||[],null,2))}</pre></details><details><summary>Entity position and asset changes</summary><pre>${esc(JSON.stringify(H.diff?.entity_changes||[],null,2))}</pre></details></section><section class="panel"><h2>Session cohorts</h2><pre>${esc(JSON.stringify(H.session_cohorts||{},null,2))}</pre><h3>Observed source appearances</h3><pre>${esc(JSON.stringify(H.source_appearances||[],null,2))}</pre><h3>Content changes</h3><pre>${esc(JSON.stringify(H.content_changes||[],null,2))}</pre><h3>Earlier observations</h3>${(H.timeline||[]).map(t=>`<p>${link(t.report_file,t.at)} ${tag(t.session_mode)} ${tag(t.status)}</p>`).join('')}</section>`;
document.getElementById('capture').innerHTML=`<section class="panel"><div class="step">CAPTURE & CONTEXT</div><h2>What was actually observed</h2><p>Requested city label: ${esc(R.inputs.city)}</p><h3>Google location display and browser context</h3><pre>${esc(JSON.stringify(R.context,null,2))}</pre><h3>Capture outcome</h3><pre>${esc(JSON.stringify(R.capture,null,2))}</pre><h3>Image destinations and entity actions</h3><pre>${esc(JSON.stringify(G.asset_relationships||[],null,2))}</pre><h3>Coverage and unresolved evidence</h3><pre>${esc(JSON.stringify({capture:R.capture_evidence.coverage,research:R.research.gaps,extraction:R.extraction_warnings},null,2))}</pre></section><section class="panel"><h2>Recorded browser states</h2>${R.capture_evidence.states.map(s=>`<details><summary>${esc(s.id)} · ${esc(s.label)}</summary>${shot(s.screenshot)}<p>${link(s.snapshot_file,'Snapshot JSON')}</p><code>${esc(s.dom_sha256)}</code></details>`).join('')}</section>`;
function show(view){document.querySelectorAll('.view').forEach(e=>e.hidden=e.id!==view);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{selected=b.dataset.jump;show('claims');renderList();renderChain();});document.getElementById('filter').oninput=renderList;renderList();renderChain();
</script></body></html>
